<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Health Wheel — KSD Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #42867b;
    --teal-light: #5ab3a5;
    --teal-glow: rgba(66,134,123,0.3);
    --dark: #0f0f0f;
    --grey: #1a1a1a;
    --light: #f5f5f3;
    --mid: #888;
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    background: var(--dark);
    color: var(--light);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
 
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
 
  .header .eyebrow {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--teal-light);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
 
  .header h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 48px);
    line-height: 1.05;
    letter-spacing: -1px;
    text-transform: uppercase;
  }
 
  .header h1 span {
    color: var(--teal);
  }
 
  .header .sub {
    font-size: 13px;
    color: var(--mid);
    margin-top: 14px;
    font-weight: 300;
    letter-spacing: 0.3px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }
 
  .wheel-container {
    position: relative;
    width: min(480px, 90vw);
    height: min(480px, 90vw);
    margin-bottom: 48px;
  }
 
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
 
  .center-score {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
 
  .center-score .score-num {
    font-size: clamp(32px, 8vw, 52px);
    font-weight: 900;
    color: var(--teal-light);
    line-height: 1;
  }
 
  .center-score .score-label {
    font-size: 10px;
    color: var(--mid);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }
 
  .sliders {
    width: min(560px, 95vw);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 32px;
  }
 
  @media (max-width: 600px) {
    .sliders { grid-template-columns: 1fr; }
  }
 
  .slider-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
 
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
 
  .slider-name {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--light);
  }
 
  .slider-val {
    font-size: 18px;
    font-weight: 900;
    color: var(--teal-light);
    min-width: 24px;
    text-align: right;
  }
 
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: var(--grey);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
 
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--teal);
    border: 2px solid var(--teal-light);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
 
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
    box-shadow: 0 0 12px var(--teal-glow);
  }
 
  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--teal);
    border: 2px solid var(--teal-light);
    cursor: pointer;
  }
 
  .result-band {
    margin-top: 40px;
    width: min(560px, 95vw);
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px 28px;
    background: var(--grey);
    text-align: center;
    transition: all 0.4s ease;
  }
 
  .result-band .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--mid);
    margin-bottom: 8px;
  }
 
  .result-band .verdict {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 28px);
    text-transform: uppercase;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
 
  .result-band .verdict-desc {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--mid);
    line-height: 1.6;
  }
 
  .divider {
    width: 40px;
    height: 2px;
    background: var(--teal);
    margin: 14px auto;
  }
 
  .cta-block {
    margin-top: 40px;
    text-align: center;
  }
 
  .cta-block p {
    font-size: 12px;
    color: var(--mid);
    margin-bottom: 16px;
    font-weight: 300;
  }
 
  .cta-btn {
    display: inline-block;
    background: var(--teal);
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 14px 32px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
  }
 
  .cta-btn:hover {
    background: var(--teal-light);
    transform: translateY(-2px);
  }
 
  .brand {
    margin-top: 48px;
    text-align: center;
  }
 
  .brand-name {
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--teal);
  }
 
  .brand-tag {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--mid);
    margin-top: 4px;
  }
</style>
</head>
<body>
 
<div class="header">
  <img src="Assets/ksd.png" alt="KSD Digital Logo" style="height: 40px; filter: brightness(0) invert(1); margin-bottom: 24px;">
  <div class="eyebrow">Rate your business honestly</div>
  <h1>Business<br><span>Health Wheel</span></h1>
  <p class="sub">Score each area 1–10. No judgement. Just clarity.</p>
</div>
 
<div class="wheel-container">
  <canvas id="wheel"></canvas>
  <div class="center-score">
    <div class="score-num" id="avgScore">5.0</div>
    <div class="score-label">Avg Score</div>
  </div>
</div>
 
<div class="sliders" id="sliders"></div>
 
<div class="result-band" id="resultBand">
  <div class="label">Your Business Health</div>
  <div class="verdict" id="verdict">—</div>
  <div class="divider"></div>
  <div class="verdict-desc" id="verdictDesc">Adjust the sliders to see your result.</div>
</div>
 
<div class="cta-block">
  <p>Want to improve your scores? Let's talk.</p>
  <a class="cta-btn" href="https://wa.me/2347063172724?text=I%20want%20to%20GROW" target="_blank">DM "GROW" to start</a>
</div>
 
<div class="brand">
  <div class="brand-name">KSD Digital</div>
  <div class="brand-tag">Engineered for results</div>
</div>
 
<script>
const categories = [
  { name: "Cashflow",       color: "#42867b" },
  { name: "Marketing",      color: "#5ab3a5" },
  { name: "Sales",          color: "#3d7a70" },
  { name: "Customer Experience",  color: "#6ec4b8" },
  { name: "Product Quality",color: "#2e6b62" },
  { name: "Brand Visibility",color:"#7dd4ca" },
  { name: "Operations",     color: "#4a9e94" },
  { name: "Strategy",       color: "#35857b" },
];
 
const scores = new Array(categories.length).fill(5);
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
 
function resizeCanvas() {
  const size = canvas.parentElement.offsetWidth;
  canvas.width = size;
  canvas.height = size;
  drawWheel();
}
 
function drawWheel() {
  const W = canvas.width;
  const cx = W / 2, cy = W / 2;
  const maxR = W * 0.38;
  const n = categories.length;
  const slice = (Math.PI * 2) / n;
  const offset = -Math.PI / 2;
 
  ctx.clearRect(0, 0, W, W);
 
  // Background rings
  for (let i = 10; i >= 1; i--) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR * (i / 10), 0, Math.PI * 2);
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.02)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
 
  // Spoke lines
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
 
  // Filled polygon
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    const r = maxR * (scores[i] / 10);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(66,134,123,0.25)';
  ctx.fill();
  ctx.strokeStyle = '#42867b';
  ctx.lineWidth = 2;
  ctx.stroke();
 
  // Dots at each score point
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    const r = maxR * (scores[i] / 10);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#5ab3a5';
    ctx.fill();
  }
 
  // Labels
  const labelR = maxR + W * 0.085;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.max(W * 0.022, 10)}px Montserrat, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
 
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    const lx = cx + Math.cos(angle) * labelR;
    const ly = cy + Math.sin(angle) * labelR;
 
    // Wrap long names
    const name = categories[i].name;
    const words = name.split(' ');
    if (words.length > 1) {
      ctx.fillText(words[0], lx, ly - W * 0.012);
      ctx.fillText(words.slice(1).join(' '), lx, ly + W * 0.012);
    } else {
      ctx.fillText(name, lx, ly);
    }
  }
 
  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#42867b';
  ctx.fill();
}
 
function updateResult() {
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
  document.getElementById('avgScore').textContent = avg.toFixed(1);
 
  const band = document.getElementById('resultBand');
  const verdict = document.getElementById('verdict');
  const desc = document.getElementById('verdictDesc');
 
  let v, d, color;
  if (avg >= 8) {
    v = "Thriving Business";
    d = "You're operating at a high level. The goal now is to protect what's working and scale it intentionally.";
    color = "#5ab3a5";
  } else if (avg >= 6) {
    v = "Good Business";
    d = "Solid foundation. A few gaps are holding back your full potential. Identify your lowest scores — that's where your next breakthrough is.";
    color = "#42867b";
  } else if (avg >= 4) {
    v = "Struggling Business";
    d = "You're working hard but the system has leaks. Revenue, visibility, or follow-through needs urgent attention before scaling.";
    color = "#e8a838";
  } else {
    v = "Crisis Mode";
    d = "The business needs structural work before marketing can help. Let's start from the foundation.";
    color = "#c0392b";
  }
 
  verdict.textContent = v;
  verdict.style.color = color;
  desc.textContent = d;
  band.style.borderColor = color + '44';
}
 
// Build sliders
const slidersEl = document.getElementById('sliders');
categories.forEach((cat, i) => {
  const item = document.createElement('div');
  item.className = 'slider-item';
  item.innerHTML = `
    <div class="slider-header">
      <span class="slider-name">${cat.name}</span>
      <span class="slider-val" id="val-${i}">5</span>
    </div>
    <input type="range" min="1" max="10" value="5" id="range-${i}">
  `;
  slidersEl.appendChild(item);
 
  const range = item.querySelector('input');
  range.addEventListener('input', () => {
    scores[i] = parseInt(range.value);
    document.getElementById(`val-${i}`).textContent = range.value;
    drawWheel();
    updateResult();
  });
});
 
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
updateResult();
</script>
</body>
</html>
