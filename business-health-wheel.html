<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Growth Wheel — KSD Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Montserrat:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --teal: #42867b;
    --teal-light: #5ab3a5;
    --teal-glow: rgba(66,134,123,0.3);
    --dark: #0f0f0f;
    --grey: #1a1a1a;
    --light: #f5f5f3;
    --mid: #888;
  }
 
  * { margin: 0; padding: 0; box-sizing: border-box; }
 
  body {
    background: var(--dark);
    color: var(--light);
    font-family: 'Montserrat', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
 
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
 
  .header .eyebrow {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 16px;
    color: var(--teal-light);
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
 
  .header h1 {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 6vw, 48px);
    line-height: 1.05;
    letter-spacing: -1px;
    text-transform: uppercase;
  }
 
  .header h1 span {
    color: var(--teal);
  }
 
  .header .sub {
    font-size: 13px;
    color: var(--mid);
    margin-top: 14px;
    font-weight: 300;
    letter-spacing: 0.3px;
    max-width: 380px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }
 
  .wheel-container {
    position: relative;
    width: min(480px, 90vw);
    height: min(480px, 90vw);
    margin-bottom: 48px;
  }
 
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
  }
 
  .center-score {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
 
  .center-score .score-num {
    font-size: clamp(32px, 8vw, 52px);
    font-weight: 900;
    color: var(--teal-light);
    line-height: 1;
  }
 
  .center-score .score-label {
    font-size: 10px;
    color: var(--mid);
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-top: 4px;
  }
 
  .sliders {
    width: min(560px, 95vw);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 32px;
  }
 
  @media (max-width: 600px) {
    .sliders { grid-template-columns: 1fr; }
  }
 
  .slider-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
 
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
 
  .slider-name {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--light);
  }
 
  .slider-val {
    font-size: 18px;
    font-weight: 900;
    color: var(--teal-light);
    min-width: 24px;
    text-align: right;
  }
 
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 3px;
    background: var(--grey);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
 
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--teal);
    border: 2px solid var(--teal-light);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
 
  input[type=range]::-webkit-slider-thumb:hover {
    transform: scale(1.3);
    box-shadow: 0 0 12px var(--teal-glow);
  }
 
  input[type=range]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--teal);
    border: 2px solid var(--teal-light);
    cursor: pointer;
  }
 
  .result-band {
    margin-top: 40px;
    width: min(560px, 95vw);
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 24px 28px;
    background: var(--grey);
    text-align: center;
    transition: all 0.4s ease;
  }
 
  .result-band .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--mid);
    margin-bottom: 8px;
  }
 
  .result-band .verdict {
    font-family: 'Montserrat', sans-serif;
    font-weight: 900;
    font-size: clamp(20px, 5vw, 28px);
    text-transform: uppercase;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
  }
 
  .result-band .verdict-desc {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--mid);
    line-height: 1.6;
  }
 
  .divider {
    width: 40px;
    height: 2px;
    background: var(--teal);
    margin: 14px auto;
  }
 
  .cta-block {
    margin-top: 40px;
    text-align: center;
  }
 
  .cta-block p {
    font-size: 12px;
    color: var(--mid);
    margin-bottom: 16px;
    font-weight: 300;
  }
 
  .cta-btn {
    display: inline-block;
    background: var(--teal);
    color: white;
    font-family: 'Montserrat', sans-serif;
    font-weight: 800;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    padding: 14px 32px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    text-decoration: none;
  }
 
  .cta-btn:hover {
    background: var(--teal-light);
    transform: translateY(-2px);
  }
 
  .brand {
    margin-top: 48px;
    text-align: center;
  }
 
  .brand-name {
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--teal);
  }
 
  .brand-tag {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 11px;
    color: var(--mid);
    margin-top: 4px;
  }
</style>
</head>
<body>
 
<div class="header">
  <img src="Assets/ksd.png" alt="KSD Digital Logo" style="height: 40px; filter: brightness(0) invert(1); margin-bottom: 24px;">
  <div class="eyebrow">Rate your client acquisition system</div>
  <h1>Solar<br><span>Growth Wheel</span></h1>
  <p class="sub">Score your solar brand's system. Pinpoint your leaks in 60 seconds.</p>
</div>
 
<div class="wheel-container">
  <canvas id="wheel"></canvas>
  <div class="center-score">
    <div class="score-num" id="avgScore">5.0</div>
    <div class="score-label">Avg Score</div>
  </div>
</div>
 
<div class="sliders" id="sliders"></div>
 
<div class="result-band" id="resultBand">
  <div class="label">Your Business Health</div>
  <div class="verdict" id="verdict">—</div>
  <div class="divider"></div>
  <div class="verdict-desc" id="verdictDesc">Adjust the sliders to see your result.</div>
</div>
 
<div class="cta-block">
  <p>Want to improve your scores? Let's talk.</p>
  <a class="cta-btn" id="whatsapp-cta" href="https://wa.me/2347063172724?text=I%20want%20to%20GROW" target="_blank">DM "GROW" to start</a>
</div>
 
<div class="brand">
  <div class="brand-name">KSD Digital</div>
  <div class="brand-tag">Engineered for results</div>
</div>
 
<script>
const categories = [
  { name: "Lead Volume",       desc: "How consistently do you generate fresh inquiries each day to keep your team busy?", color: "#42867b" },
  { name: "Lead Quality",      desc: "Are your leads qualified duplex owners/businesses, or are they just window-shopping renters?", color: "#5ab3a5" },
  { name: "Ad Attribution",    desc: "Do you know exactly which ad creative or hook brought in your closed installations?", color: "#3d7a70" },
  { name: "Follow-Up Speed",   desc: "How fast does your sales team reply to new inquiries on WhatsApp?", color: "#6ec4b8" },
  { name: "Brand Trust",       desc: "Does your online presence address the high skepticism surrounding bad solar installs?", color: "#2e6b62" },
  { name: "Referral Systems",  desc: "Do you have a structured post-installation system to turn client yards into referral engines?", color: "#7dd4ca" },
];
 
const scores = new Array(categories.length).fill(5);
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
 
function resizeCanvas() {
  const size = canvas.parentElement.offsetWidth;
  canvas.width = size;
  canvas.height = size;
  drawWheel();
}
 
function drawWheel() {
  const W = canvas.width;
  const cx = W / 2, cy = W / 2;
  const maxR = W * 0.38;
  const n = categories.length;
  const slice = (Math.PI * 2) / n;
  const offset = -Math.PI / 2;
 
  ctx.clearRect(0, 0, W, W);
 
  // Background rings
  for (let i = 10; i >= 1; i--) {
    ctx.beginPath();
    ctx.arc(cx, cy, maxR * (i / 10), 0, Math.PI * 2);
    ctx.strokeStyle = i % 2 === 0 ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
 
  // Spoke lines
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
 
  // Filled polygon
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    const r = maxR * (scores[i] / 10);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(90, 179, 165, 0.45)';
  ctx.fill();
  ctx.strokeStyle = '#5ab3a5';
  ctx.lineWidth = 3;
  ctx.stroke();
 
  // Dots at each score point
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    const r = maxR * (scores[i] / 10);
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#1de9b6';
    ctx.fill();
  }
 
  // Labels
  const labelR = maxR + W * 0.085;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.max(W * 0.022, 10)}px Montserrat, sans-serif`;
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
 
  for (let i = 0; i < n; i++) {
    const angle = offset + slice * i;
    const lx = cx + Math.cos(angle) * labelR;
    const ly = cy + Math.sin(angle) * labelR;
 
    // Wrap long names
    const name = categories[i].name;
    const words = name.split(' ');
    if (words.length > 1) {
      ctx.fillText(words[0], lx, ly - W * 0.012);
      ctx.fillText(words.slice(1).join(' '), lx, ly + W * 0.012);
    } else {
      ctx.fillText(name, lx, ly);
    }
  }
 
  // Center dot
  ctx.beginPath();
  ctx.arc(cx, cy, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#5ab3a5';
  ctx.fill();
}
 
function updateResult() {
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
  document.getElementById('avgScore').textContent = avg.toFixed(1);
 
  const band = document.getElementById('resultBand');
  const verdict = document.getElementById('verdict');
  const desc = document.getElementById('verdictDesc');
 
  let v, d, color;
  if (avg >= 8) {
    v = "High-Performance Engine";
    d = "Your system is operating at a high level with clean targeting, quick follow-up, and strong trust indicators. The goal now is to protect what is working, avoid ad fatigue, and scale your campaigns safely without resetting the algorithm.";
    color = "#5ab3a5";
    document.getElementById('whatsapp-cta').href = "https://wa.me/2347063172724?text=Hey%20Kosy%2C%20my%20Solar%20Growth%20Wheel%20is%20doing%20great.%20Help%20me%20scale%20it.";
    document.getElementById('whatsapp-cta').textContent = 'DM "SCALE" TO PARTNER';
  } else if (avg >= 5) {
    v = "Unstable Pipeline";
    d = "You have a solid foundation, but key bottlenecks are holding back your full potential. You might get decent leads but struggle with follow-up speed, or have high-quality installs but lack a structured referral system. Focus on your lowest-scoring area first.";
    color = "#42867b";
    document.getElementById('whatsapp-cta').href = "https://wa.me/2347063172724?text=Hey%20Kosy%2C%20my%20Solar%20Growth%20Wheel%20is%20unstable.%20Help%20me%20audit%20it.";
    document.getElementById('whatsapp-cta').textContent = 'DM "AUDIT" TO EVALUATE';
  } else {
    v = "Leaking Budget";
    d = "Your solar client acquisition engine has major holes. You are likely spending heavily on ads but chasing unserious inquiries, or letting hot leads go cold due to slow response times. The system needs urgent structural work before scaling.";
    color = "#e8a838";
    document.getElementById('whatsapp-cta').href = "https://wa.me/2347063172724?text=Hey%20Kosy%2C%20my%20Solar%20Growth%20Wheel%20is%20leaking.%20Help%20me%20fix%20it.";
    document.getElementById('whatsapp-cta').textContent = 'DM "FIX" TO SEAL LEAKS';
  }
 
  verdict.textContent = v;
  verdict.style.color = color;
  desc.textContent = d;
  band.style.borderColor = color + '44';
}
 
// Build sliders
const slidersEl = document.getElementById('sliders');
categories.forEach((cat, i) => {
  const item = document.createElement('div');
  item.className = 'slider-item';
  item.innerHTML = `
    <div class="slider-header">
      <span class="slider-name">${cat.name}</span>
      <span class="slider-val" id="val-${i}">5</span>
    </div>
    <input type="range" min="1" max="10" value="5" id="range-${i}">
    <p style="font-size: 11px; color: var(--mid); margin-top: 4px; line-height: 1.4;">${cat.desc}</p>
  `;
  slidersEl.appendChild(item);
 
  const range = item.querySelector('input');
  range.addEventListener('input', () => {
    scores[i] = parseInt(range.value);
    document.getElementById(`val-${i}`).textContent = range.value;
    drawWheel();
    updateResult();
  });
});
 
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
updateResult();
</script>
</body>
</html>
